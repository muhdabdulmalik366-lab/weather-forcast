<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-container">

        <h1>🌤️ Weather App</h1>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>
        </div>

        <p id="loading"></p>
        <p id="error"></p>

        <div class="weather-info">

            <h2 id="cityName">Search for a city</h2>

            <div id="weatherIcon">🌤️</div>

            <h3 id="temperature">--°C</h3>

            <p id="condition">Weather condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>🌧️</span>
                    <p>Rain</p>
                    <strong id="rain">-- mm</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
